[pytest]
pythonpath = . ..
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    smoke: Quick sanity tests for critical pages
    e2e: Full end-to-end user journey tests
    login: Authentication and session tests
    navigation: Sidebar and routing tests
    dashboard: Dashboard and metrics tests
    mentor: AI mentor and copilot tests
