name: Pre-Merge CI/CD Pipeline

on:
  pull_request:
    branches: [ main, master ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run full Selenium E2E test suite"
        required: false
        default: true
        type: boolean

# Cancel outdated in-flight runs when new commits are pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Backend Testing & Security Validation
  # =========================================================================
  backend-tests:
    name: Backend Test Suite & Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        working-directory: backend
        run: |
          python -m pytest tests/ -v --tb=short

  # =========================================================================
  # 2. Frontend Lint, Typecheck & Production Build
  # =========================================================================
  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate TypeScript Compilation & Vite Build
        working-directory: frontend
        run: npm run build

  # =========================================================================
  # 3. Full-Stack End-to-End Browser Automation (Selenium 4 + Headless Chrome)
  # =========================================================================
  e2e-selenium-tests:
    name: Selenium E2E Page Tests (Headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            tests_e2e/requirements-test.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python Test & Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r tests_e2e/requirements-test.txt

      - name: Install Frontend Dependencies & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Start Backend API Server
        working-directory: backend
        env:
          PORT: 8000
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo "Waiting for backend server to respond..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/api/health > /dev/null; then
              echo "Backend is healthy!"
              break
            fi
            sleep 1
          done

      - name: Start Frontend Preview Server
        working-directory: frontend
        run: |
          npx vite preview --port 5173 --host &
          echo "Waiting for frontend preview server to respond..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5173 > /dev/null; then
              echo "Frontend is healthy!"
              break
            fi
            sleep 1
          done

      - name: Run Selenium 4 E2E Test Suite
        env:
          BASE_URL: http://localhost:5173
        run: |
          python -m pytest tests_e2e/ -v --tb=short --base-url=http://localhost:5173

      - name: Upload Screenshot Artifacts on Test Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-failure-screenshots
          path: tests_e2e/screenshots/
          retention-days: 7

  # =========================================================================
  # 4. Unified Pre-Merge Gate (For GitHub Branch Protection Rules)
  # =========================================================================
  pre-merge-gate:
    name: Pre-Merge Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build, e2e-selenium-tests]
    if: always()

    steps:
      - name: Verify All Quality Checks Succeeded
        run: |
          if [ "${{ needs.backend-tests.result }}" != "success" ]; then
            echo "::error::Backend tests failed!"
            exit 1
          fi
          if [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "::error::Frontend build/typecheck failed!"
            exit 1
          fi
          if [ "${{ needs.e2e-selenium-tests.result }}" != "success" ]; then
            echo "::error::Selenium E2E tests failed!"
            exit 1
          fi
          echo "All pre-merge checks passed successfully! Ready for merge."
